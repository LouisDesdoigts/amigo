[project]
name = "amigo"
version = "0.1.0"
description = "A pipeline for interferometric fitting of AMI data from JWST"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Louis Desdoigts", email = "louis.desdoigts@sydney.edu.au"},
]
keywords = []
urls = {repository = "https://github.com/LouisDesdoigts/amigo"}
dependencies = [
  "jax==0.9.2",
  "jaxlib==0.9.2",
  "zodiax @ git+https://github.com/LouisDesdoigts/zodiax.git@769c98136aaea0fdd8b27bc771c1f18c8c2bb65c",
  "dLux==0.15.1",
  "abcdLux==0.0.2",
  "equinox==0.13.6",
  "optimistix==0.1.0",
  "lineax==0.1.0",
  "optax==0.2.8",
  "interpax==0.3.13",
  "numpy==2.4.3",
  "scipy==1.17.1",
  "astropy==7.2.0",
  "tqdm==4.67.3",
  "IPython==9.12.0",
  "matplotlib==3.10.8",
]

classifiers=[
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[build-system]
requires = [
    "setuptools>=60",
    "setuptools-scm>=8.0",
    "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
amigo = ["data/*.npy", "data/filters/*.dat"]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "pre-commit"]


[tool.black]
line-length = 99

[tool.ruff]
line-length = 99
select = ["E", "F"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
ignore-init-module-imports = true

[tool.ruff.isort]
combine-as-imports = true
lines-after-imports = 2
